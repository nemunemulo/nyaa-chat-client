; ============================================================================
; NyaaChat 클라이언트 환경설정 예시 (settings.example.ini)
; ============================================================================
; 실제 프로그램 실행 시 이 파일을 바탕으로 settings.ini 가 자동 생성됩니다.
; 사용자의 개인 설정 및 닉네임은 settings.ini 에만 저장되며, Git에 포함되지 않습니다.

[General]
Language=
LanguageConfigured=false

[Server]
Url=https://nemulo.duckdns.org
DefaultChannel=#자유대화
AutoConnect=true
ExtraServers=
AutoConnectServers=https://nemulo.duckdns.org

[AutoJoin]
nemulo.duckdns.org=#자유대화

[User]
DefaultNickname=
NickPassword=
Avatar=🐾
QuitMessage=NyaaChat Native - 좋은 하루 되세요!
UserId=

[Window]
Title=Nyaa Chat Native Multi-Server Client
Width=1140
Height=640
AlwaysOnTop=false
Opacity=100
MinimizeToTrayOnClose=false
LeftPanelWidth=240
RightPanelWidth=200

[Theme]
ActiveTheme=default_dark.ini
FontFamily=
FontSize=10
ShowTimestamps=true
FontWeight=normal
NickColoring=true

[Highlight]
Keywords=공지, 질문, 오류
EnableSound=true
EnableFlash=true

[Ignore]
Users=

[Logging]
SaveLogs=true

[Sounds]
EnableSounds=true
UseSystemBeepFallback=false
SoundMention=
SoundMessage=
SoundJoin=
SoundAlert=

[Security]
SkipLinkWarning=false
